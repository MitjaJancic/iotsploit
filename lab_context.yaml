# lab_context.yaml
# Scope control policy for iotsploit active checks and verification probes.
# Ensures all verification actions stay strictly confined to authorized lab networks.

enforce_scope: true

allowed_cidrs:
  - "127.0.0.0/8"        # Loopback and local mock services
  - "192.168.42.0/24"    # OWASP IoTGoat / virtual router subnet
  - "192.168.33.0/24"    # Default Shelly Access Point subnet (192.168.33.1)
  - "192.168.0.0/16"     # Private lab network
  - "10.0.0.0/8"         # Enterprise IoT testbed
  - "172.16.0.0/12"      # Docker & container testbed

prohibited_cidrs: []
