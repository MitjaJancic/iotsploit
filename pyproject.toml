[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iotsploit"
version = "0.1.0"
description = "Config-driven IoT security/damage audit tool"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "paho-mqtt>=1.6",
    "zeroconf>=0.131",
    "bleak>=0.21",
    "jinja2>=3.1",
    "pymodbus>=3.5",
]

[project.scripts]
iotsploit = "iotsploit.cli:main"

[tool.setuptools.packages.find]
include = ["iotsploit*"]
